name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ansible + ansible-lint
        run: pip install ansible ansible-lint

      - name: Install role + collections (needed for the syntax-check pass)
        run: ansible-galaxy install -r requirements.yml

      - name: Stub the vault so lint needn't decrypt it
        run: |
          echo '---' > group_vars/all/vault.yml

      - name: ansible-lint
        run: ansible-lint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  yaml:
    # Whole-repo, every push/PR (not path-filtered like validate.yaml) -
    # style/syntax hygiene that ansible-lint doesn't cover for argocd/ and
    # kubeconform doesn't cover for ansible/. See .yamllint.yaml for what's
    # deliberately relaxed and why.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint -c .yamllint.yaml .

  secrets:
    # Whole-repo history scan for anything secret-shaped that shouldn't be
    # here - the automated backstop for what was, until now, only a manual
    # check done once before this repo was briefly made public.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action calls the PR-commits API on `pull_request` runs - 403s without this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
