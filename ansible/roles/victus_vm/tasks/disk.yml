---
# The 512 GB NVMe as one LVM volume group with three logical volumes (OS, backups, torrent
# staging) that main.yml hands to the VM as three raw virtio disks. Modelled on the mini01
# media disk role, with the same fence, because it can format a disk:
#   - the disk is FOUND by serial (and model) and must be a whole disk of a sane size with
#     nothing mounted on it; the 1 TB system disk can never match;
#   - it only CREATES anything when `victus_vm_disk_provision` is true AND the disk is provably
#     blank, or to finish an interrupted run of itself;
#   - any other state (the old Debian LVM vg0, a filesystem, extra partitions) FAILS with
#     nothing changed. It never wipes, overwrites, shrinks or resizes anything.
# Once provisioned, every later run only reads.

- name: Ensure the tools that read and build the layout are installed
  ansible.builtin.package:
    name:
      - util-linux # lsblk, blkid, wipefs, sfdisk, udevadm
      - lvm2
    state: present
  when: not ansible_check_mode

# lsblk lists whole disks only (-d). The serial is passed through the environment, never
# interpolated into the shell text.
- name: Find the disk by serial
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -dnb -o PATH,TYPE,SIZE,SERIAL | awk -v s="$WANT_SERIAL" '$2 == "disk" && $4 == s { print $1, $3 }'
  args:
    executable: /bin/bash
  environment:
    WANT_SERIAL: "{{ victus_vm_disk_serial }}"
  register: victus_vm_disk_found
  changed_when: false
  check_mode: false

- name: Assert exactly one disk has that serial
  ansible.builtin.assert:
    that:
      - victus_vm_disk_serial | length > 0
      - victus_vm_disk_found.stdout_lines | length == 1
    fail_msg: >-
      Expected exactly one whole disk with serial '{{ victus_vm_disk_serial }}' on
      {{ inventory_hostname }}, found {{ victus_vm_disk_found.stdout_lines | length }}. Is the 512 GB
      disk installed? Nothing has been changed.

- name: Read the disk's model and what is mounted on it
  vars:
    victus_vm_disk_dev: "{{ victus_vm_disk_found.stdout_lines[0].split()[0] }}"
  ansible.builtin.shell: |
    set -o pipefail
    printf 'MODEL=%s\n' "$(lsblk -dn -o MODEL "$DEV" | sed 's/[[:space:]]*$//')"
    # every mountpoint of the disk and of anything on it (partitions, LVs)
    printf 'MOUNTS=%s\n' "$(lsblk -nr -o MOUNTPOINTS "$DEV" | tr -s '\n' ' ' | sed 's/[[:space:]]*$//')"
  args:
    executable: /bin/bash
  environment:
    DEV: "{{ victus_vm_disk_dev }}"
  register: victus_vm_disk_info
  changed_when: false
  check_mode: false

- name: Assert this is the disk we pinned (model, size, nothing mounted)
  vars:
    victus_vm_disk_path: "{{ victus_vm_disk_found.stdout_lines[0].split()[0] }}"
    victus_vm_disk_size_gib: "{{ (victus_vm_disk_found.stdout_lines[0].split()[1] | int) / 1024 / 1024 / 1024 }}"
    victus_vm_disk_model: "{{ (victus_vm_disk_info.stdout_lines | select('match', '^MODEL=') | first) | regex_replace('^MODEL=', '') }}"
    victus_vm_disk_mounts: "{{ (victus_vm_disk_info.stdout_lines | select('match', '^MOUNTS=') | first) | regex_replace('^MOUNTS=', '') }}"
    victus_vm_disk_need_gib: "{{ (victus_vm_lv_os_gib | int) + (victus_vm_lv_backups_gib | int) + (victus_vm_lv_staging_gib | int) }}"
  ansible.builtin.assert:
    that:
      - victus_vm_disk_model is regex(victus_vm_disk_model_regex)
      - (victus_vm_disk_size_gib | float) is ge (victus_vm_disk_min_size_gib | float)
      - (victus_vm_disk_size_gib | float) is le (victus_vm_disk_max_size_gib | float)
      - victus_vm_disk_mounts | trim | length == 0
      # the three volumes plus the 1 GiB of partition and LVM overhead must fit
      - ((victus_vm_disk_need_gib | float) + 1) is lt (victus_vm_disk_size_gib | float)
    fail_msg: >-
      {{ victus_vm_disk_path }} is not the disk this role expects: model '{{ victus_vm_disk_model }}'
      (want {{ victus_vm_disk_model_regex }}), size {{ victus_vm_disk_size_gib | float | round(1) }} GiB (want
      {{ victus_vm_disk_min_size_gib }} to {{ victus_vm_disk_max_size_gib }}, and room for
      {{ victus_vm_disk_need_gib }} GiB of volumes), mounted: '{{ victus_vm_disk_mounts }}' (want nothing).
      Refusing to touch it. Nothing has been changed.

- name: Remember the disk path
  ansible.builtin.set_fact:
    victus_vm_disk_path: "{{ victus_vm_disk_found.stdout_lines[0].split()[0] }}"
    # nvme0n1 -> nvme0n1p1, sda -> sda1
    victus_vm_disk_part1: >-
      {{ victus_vm_disk_found.stdout_lines[0].split()[0] }}{{ 'p' if victus_vm_disk_found.stdout_lines[0].split()[0] is regex('[0-9]$') else '' }}1

- name: List any signatures on the whole disk (partition table, filesystem, LVM)
  ansible.builtin.command: "wipefs --noheadings {{ victus_vm_disk_path }}"
  register: victus_vm_disk_wipefs
  changed_when: false
  check_mode: false

- name: List the partitions on the disk
  ansible.builtin.command: "lsblk -nr -o TYPE {{ victus_vm_disk_path }}"
  register: victus_vm_disk_types
  changed_when: false
  check_mode: false

# One line: filesystem type, signature count, VG (blank when partition 1 does not exist or is
# not a PV). wipefs is asked as well as blkid so a partition holding something blkid does not
# recognise is never mistaken for empty.
- name: Read what is on partition 1, if it exists
  ansible.builtin.shell: |
    set -o pipefail
    p="$PART"
    if [ -e "$p" ]; then
      fs="$(blkid -o value -s TYPE "$p" 2>/dev/null || true)"
      sigs="$(wipefs --noheadings "$p" 2>/dev/null | grep -c . || true)"
      vg="$(pvs --noheadings -o vg_name "$p" 2>/dev/null | tr -d ' ' || true)"
      printf '%s|%s|%s\n' "$fs" "$sigs" "$vg"
    fi
  args:
    executable: /bin/bash
  environment:
    PART: "{{ victus_vm_disk_part1 }}"
  register: victus_vm_disk_p1_raw
  changed_when: false
  check_mode: false

- name: Read the logical volumes of our volume group, if it exists
  ansible.builtin.shell: "lvs --noheadings -o lv_name {{ victus_vm_vg }} 2>/dev/null | tr -d ' ' || true"
  register: victus_vm_disk_lvs_raw
  changed_when: false
  check_mode: false

- name: Digest the reads
  vars:
    victus_vm_disk_p1_parts: "{{ (victus_vm_disk_p1_raw.stdout | trim).split('|') if (victus_vm_disk_p1_raw.stdout | trim | length > 0) else ['', '0', ''] }}"
  ansible.builtin.set_fact:
    victus_vm_disk_sigs: "{{ victus_vm_disk_wipefs.stdout }}"
    victus_vm_disk_nparts: "{{ victus_vm_disk_types.stdout_lines | select('equalto', 'part') | list | length }}"
    victus_vm_disk_p1_fs: "{{ victus_vm_disk_p1_parts[0] }}"
    victus_vm_disk_p1_sigs: "{{ victus_vm_disk_p1_parts[1] }}"
    victus_vm_disk_p1_vg: "{{ victus_vm_disk_p1_parts[2] }}"
    victus_vm_disk_lvs: "{{ victus_vm_disk_lvs_raw.stdout_lines | map('trim') | reject('equalto', '') | list }}"

- name: Work out which state the disk is in
  ansible.builtin.include_tasks: disk_state.yml

- name: Refuse to touch a disk that is neither blank nor ours
  ansible.builtin.assert:
    that:
      - victus_vm_disk_state != 'unexpected'
    fail_msg: >-
      {{ victus_vm_disk_path }} is not blank and is not the layout this role builds (one LVM
      partition, volume group {{ victus_vm_vg }}, logical volumes mini03-os, mini03-backups and
      mini03-staging). It has {{ victus_vm_disk_nparts }} partition(s) and these signatures:
      '{{ victus_vm_disk_sigs | trim | replace('\n', '; ') }}'. This role never wipes or overwrites a disk.
      If it is really safe to discard what is on it (for example the old Debian vg0), wipe it by hand
      (ansible/README.md, "Wipe the 512 GB disk") and run this again. Nothing has been changed.

- name: Fail early, with the fix, if the layout is missing and may not be built
  ansible.builtin.assert:
    that:
      - victus_vm_disk_state == 'provisioned' or (victus_vm_disk_provision | bool)
    fail_msg: >-
      The 512 GB disk is {{ victus_vm_disk_state }}, not provisioned, and `victus_vm_disk_provision`
      is false. Wipe it on purpose, then set `victus_vm_disk_provision: true` for one run.
      Nothing has been changed.

- name: Say what would be done (check mode only)
  ansible.builtin.debug:
    msg: >-
      Disk state is '{{ victus_vm_disk_state }}': would create a GPT with one LVM partition, volume group
      {{ victus_vm_vg }} and the missing logical volumes ({{ victus_vm_lv_os_gib }},
      {{ victus_vm_lv_backups_gib }} and {{ victus_vm_lv_staging_gib }} GiB).
  when: ansible_check_mode and victus_vm_disk_state != 'provisioned'

# --- Build (destructive; only reached with victus_vm_disk_provision and a blank/own disk) ---

- name: Create the GPT with one LVM partition on the blank disk
  ansible.builtin.command:
    cmd: "sfdisk --label gpt {{ victus_vm_disk_path }}"
    stdin: "type=E6D6D379-F507-44C2-A23C-238F2A3DF928, name=victus-lvm\n"
  changed_when: true
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state == 'blank'

- name: Wait for udev and the partition node
  ansible.builtin.command: udevadm settle
  changed_when: false
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state == 'blank'

- name: Wait for partition 1 to appear
  ansible.builtin.wait_for:
    path: "{{ victus_vm_disk_part1 }}"
    timeout: 30
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state == 'blank'

# pvcreate without -f refuses a partition that carries a signature, a last line of defence.
- name: Create the physical volume
  ansible.builtin.command: "pvcreate --yes {{ victus_vm_disk_part1 }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state in ['blank', 'resumable']
    - victus_vm_disk_p1_fs != 'LVM2_member'

- name: Create the volume group
  ansible.builtin.command: "vgcreate {{ victus_vm_vg }} {{ victus_vm_disk_part1 }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state in ['blank', 'resumable']
    - victus_vm_disk_p1_vg != victus_vm_vg

- name: Create each missing logical volume (never resized, never recreated)
  ansible.builtin.command: "lvcreate --yes --name {{ item.name }} --size {{ item.gib }}G {{ victus_vm_vg }}"
  changed_when: true
  loop:
    - { name: mini03-os, gib: "{{ victus_vm_lv_os_gib }}" }
    - { name: mini03-backups, gib: "{{ victus_vm_lv_backups_gib }}" }
    - { name: mini03-staging, gib: "{{ victus_vm_lv_staging_gib }}" }
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - victus_vm_disk_provision | bool
    - victus_vm_disk_state in ['blank', 'resumable']
    - item.name not in victus_vm_disk_lvs

# The volumes are guest disks: the host must never mount or scan them.
- name: Activate the volume group so libvirt can open the volumes
  ansible.builtin.command: "vgchange --activate y {{ victus_vm_vg }}"
  changed_when: false
  when: not ansible_check_mode
