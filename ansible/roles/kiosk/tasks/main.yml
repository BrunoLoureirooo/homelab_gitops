---
# Display host for mini04 (Debian 13): cage (a single-window Wayland
# compositor) running Chromium in kiosk mode on tty1 as an unprivileged user.
# Design: docs/homelab-brief.md (kiosk section).
# See README.md in this role for Day 0 and how to run it.

- name: Refuse to run with the placeholder kiosk_url
  ansible.builtin.assert:
    that:
      - "'<tailnet-name>' not in kiosk_url"
    fail_msg: >-
      kiosk_url is still the placeholder. Set vault_kiosk_url in the vault
      (see roles/kiosk/README.md) or pass -e kiosk_url=...

- name: Install cage, Chromium and fonts
  ansible.builtin.apt:
    name: "{{ kiosk_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# No sudo group, no authorized_keys, locked password, nologin shell: the
# account cannot be logged into over SSH or at a prompt, only started by
# systemd.
- name: Create the kiosk user
  ansible.builtin.user:
    name: "{{ kiosk_user }}"
    system: true
    home: "{{ kiosk_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    password_lock: true
    groups: "{{ kiosk_groups }}"
    append: true

- name: Install the PAM service for the kiosk session
  ansible.builtin.template:
    src: pam-kiosk.j2
    dest: /etc/pam.d/kiosk
    owner: root
    group: root
    mode: "0644"

# Unpacked Chromium extension that sets `cursor: none` on every page. cage 0.2.0 has
# no option to hide the pointer, and Chromium draws its own cursor, so this is done in
# the page. Root-owned and world-readable: the kiosk user only needs to read it.
- name: Create the hide-cursor extension directory
  ansible.builtin.file:
    path: "{{ kiosk_extension_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the hide-cursor extension files
  ansible.builtin.copy:
    src: "hide-cursor/{{ item }}"
    dest: "{{ kiosk_extension_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - manifest.json
    - hide-cursor.css
  notify: Restart kiosk

- name: Install kiosk.service
  ansible.builtin.template:
    src: kiosk.service.j2
    dest: /etc/systemd/system/kiosk.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart kiosk
  # kiosk_url comes from the vault and contains the private tailnet hostname. This
  # repo is public and so are its Actions logs, so `--diff` must never print it.
  diff: false

# In a dry run (--check) the unit file above is only rendered, never written, so
# systemd cannot find kiosk.service yet and this fails. Ignore that in check mode only.
- name: Enable kiosk.service
  ansible.builtin.systemd_service:
    name: kiosk.service
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Read the default systemd target
  ansible.builtin.command: systemctl get-default
  register: kiosk_default_target
  changed_when: false
  check_mode: false

- name: Boot to graphical.target
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true
  when: kiosk_default_target.stdout != 'graphical.target'

- name: Never sleep, suspend or hibernate
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
