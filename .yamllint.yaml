# Repo-wide yamllint config. Deliberately lenient on style (this repo's
# comments run long and some Helm-values-adjacent files use varied
# indentation for readability) - the goal is catching real mistakes
# (duplicate keys, bad indentation that changes meaning, tabs), not
# enforcing a house style on top of what ansible-lint and kubeconform
# already check.
extends: default

# argocd/charts/**/templates/ contain Helm template syntax ({{ .Values.x }}),
# not standalone YAML - same exclusion CI's kubeconform step already makes,
# for the same reason.
ignore: |
  argocd/charts/*/templates/
  # generated by kustomize (render.sh); must equal a fresh build, so it cannot be re-indented
  talos/manifests/immich-infra/

rules:
  line-length: disable
  document-start: disable # not every file here uses `---`, and that's fine
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "on"] # ansible + k3s configs use `on` for flags in a couple of places
  braces:
    max-spaces-inside: 1 # this repo's compact-object style ({ key: value }) reads better with a space
  brackets:
    max-spaces-inside: 1
  octal-values:
    # ansible-lint requires both explicitly true (it shells out to yamllint
    # itself and refuses to run its auto-fixer against a config missing
    # these) - forbids unquoted 0644-style literals, which some YAML parsers
    # read as octal numbers rather than strings. This repo already always
    # quotes file modes (`mode: "0644"`), so this is a no-op in practice,
    # just satisfying ansible-lint's compatibility check.
    forbid-implicit-octal: true
    forbid-explicit-octal: true
