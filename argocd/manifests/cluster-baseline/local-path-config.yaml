# Routes local-path-provisioner's PVCs on victus to /srv/scratch instead of
# its default /var/lib/rancher/k3s/storage (every other node keeps the
# default), and lets its helper pod run on victus despite victus's taint.
# Originally ~/localPathConfig.yaml on mini01, applied by hand 2026-09-13.
#
# k3s's own add-on manager re-applies its stock version of this ConfigMap
# every time k3s starts, which silently undid this on the 2026-09-26
# restart. roles/k3s_host_prep now drops local-storage.yaml.skip on servers
# so k3s leaves it alone and this file is the only source of truth.
#
# Declares every key, not just the two customised ones: setup/teardown are
# the scripts the provisioner runs to create/delete volume dirs, copied
# verbatim from k3s's stock ConfigMap. The helper image is the one k3s
# ships, pinned, instead of the original hand-applied unpinned
# docker.io/library/busybox.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s/storage"]
        },
        {
          "node": "victus",
          "paths": ["/srv/scratch"]
        }
      ]
    }
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: "node-role.homeserver/tier"
          operator: "Equal"
          value: "mobile"
          effect: "NoSchedule"
      containers:
        - name: helper-pod
          image: "rancher/mirrored-library-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
