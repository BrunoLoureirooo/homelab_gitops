# Deploys every SealedSecret in argocd/sealed-secrets/ (one per Secret, each
# carrying its own namespace). The sealed-secrets controller (apps/
# sealed-secrets.yaml) decrypts them into the real Secrets the apps
# reference by name (minio-creds, immich-db-creds, vaultwarden-admin,
# operator-oauth, cloud-credentials, cp-reserva-bot).
#
# cp-reserva-bot's namespace comes from its own app (CreateNamespace), so on
# its first deploy sync apps/cp-reserva-bot.yaml before this one.
#
# The four adopted secrets already existed live, created by hand. The
# controller refuses to overwrite a Secret it didn't create, so before the
# first sync each live one gets the `sealedsecrets.bitnami.com/managed: "true"`
# annotation - see argocd/sealed-secrets/README.md. Values are identical, so
# adopting them changes nothing for the apps using them.
#
# Only .yaml files are picked up - the README and pub-cert.pem in that folder
# are ignored.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: argocd/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # Manual sync, no automated block - same stance as every other app here.
    syncOptions: []
