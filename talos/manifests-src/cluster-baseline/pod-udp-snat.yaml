# Stop flannel from randomising the source port of pod UDP egress.
#
# Why: flannel (nftables mode) masquerades pod egress with `masquerade
# fully-random`. Every flow then leaves the node with a fresh random source
# port, so the router creates a different public mapping per destination.
# That is exactly what tailscale reports as MappingVariesByDestIP: true
# ("hard NAT"), and the Tailscale proxy pods (ts-immich etc.) end up on DERP
# relays instead of direct paths. Measured 2026-10-18: `tailscale netcheck`
# from a pod on mini01 says MappingVariesByDestIP: true; the same image in
# the host network namespace of mini01 and mini02 (same router, same
# public IP) says false. So the cluster, not the router, creates the hard NAT.
#
# What: an extra nat chain at priority 99 (flannel's is 100) that
# masquerades pod -> outside UDP WITHOUT fully-random, so the kernel keeps the
# pod's source port when it is free. The pod network is read at runtime from
# flannel's /run/flannel/subnet.env (no address literal lives in git; the repo
# guards forbid them under talos/). Netfilter applies the first NAT binding
# of a flow, so flannel's later rule is skipped for these packets. TCP and
# in-cluster traffic are untouched.
#
# Rollback: delete this DaemonSet (the pod removes its table on exit), or
# `nft delete table ip pod-udp-snat` from any privileged hostNetwork pod.
# A node reboot also clears it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-udp-snat
  namespace: kube-system
  labels:
    app.kubernetes.io/name: pod-udp-snat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-udp-snat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-udp-snat
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: nft
          # Same image flannel runs (already on every node); it ships nft.
          image: ghcr.io/siderolabs/flannel:0.28.9
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cleanup() { nft delete table ip pod-udp-snat >&2 || true; exit 0; }
              trap cleanup TERM INT
              while true; do
                if ! nft list tables 2>&1 | grep -q "table ip pod-udp-snat"; then
                  # FLANNEL_NETWORK is the whole pod network (CIDR) of the cluster.
                  net=""
                  if [ -r /run/flannel/subnet.env ]; then
                    net="$(. /run/flannel/subnet.env && echo "${FLANNEL_NETWORK:-}")"
                  fi
                  if [ -n "$net" ]; then
                    nft -f - <<EOF
              table ip pod-udp-snat {
                chain postrtg {
                  type nat hook postrouting priority 99; policy accept;
                  ip saddr $net ip daddr != $net fib daddr type != multicast meta l4proto udp masquerade
                }
              }
              EOF
                  else
                    echo "pod-udp-snat: FLANNEL_NETWORK not available yet; retrying" >&2
                  fi
                fi
                sleep 30 &
                wait $!
              done
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - {name: flannel, mountPath: /run/flannel, readOnly: true}
      volumes:
        - name: flannel
          hostPath:
            path: /run/flannel
