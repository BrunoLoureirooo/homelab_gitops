# Talos-only (plan 15-03, storage verdict local-path): Rancher's
# local-path-provisioner from its own repository, storing volumes under the Talos
# user volume `data` (mounted at /var/mnt/data, see talos/patches/volumes-mini01.yaml;
# the path is DATA_PATH in talos/FINDINGS.md). The StorageClass is NOT created by
# the chart: the generated cluster-baseline copy defines `topolvm-fast` with
# provisioner rancher.io/local-path, so every PVC keeps its class name.
# render-apps.sh leaves this file out when apps-overrides.yaml says storage: topolvm.
# The chart value names and tag are checked by the storage-bind CI job.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/local-path-provisioner
    targetRevision: v0.0.31
    path: deploy/chart/local-path-provisioner
    helm:
      valuesObject:
        storageClass:
          create: false
          # must equal the provisioner of the topolvm-fast class; the chart default
          # (cluster.local/<release>) matches nothing and every PVC stays Pending
          provisionerName: rancher.io/local-path
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /var/mnt/data/local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync, no automated block - same stance as every other app here.
