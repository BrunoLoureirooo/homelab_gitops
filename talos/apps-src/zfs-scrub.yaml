# Monthly ZFS scrub CronJob for mini02 (plan 15-05, WP6). Lives in
# talos/apps-src/, NOT in argocd/apps/: the live `root` app auto-applies
# argocd/apps/ and this app must not exist on the current k3s cluster.
# The Talos app set is generated from the sources by `talos/render-apps.sh`.
#
# Manual sync only, no automated block. Syncing also activates the monthly
# schedule (01:00 on the 1st, UTC). To test once, use Argo CD's UI Create Job
# action on the CronJob (verify it appears) instead of any command line.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zfs-scrub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: talos/storage/zfs-scrub
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
