# AdGuard Home, network-wide ad and tracker blocking DNS for the tailnet (The operator 2026-10-17).
# Plain manifests in talos/manifests/adguard-home, pinned to mini01. DNS is a Tailscale LoadBalancer
# Service (device `adguard`) and the web UI a Tailscale Ingress (`adguard-ui`), both tailnet-only.
#
# Manual sync only, no automated block: it is a resolver for every device, so the first sync is
# diffed and approved (same pattern as the other adopted apps).
# The Secret `adguard-admin` comes from talos/sealed-secrets/ (sealed, never in git in clear); this
# app does not create it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: talos/manifests/adguard-home
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
