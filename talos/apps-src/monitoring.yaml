# Monitoring stack (plan docs/plans/monitoring.md): Prometheus, Alertmanager, kube-state-metrics, node-exporter and
# Grafana in the `monitoring` namespace. Manual sync: The operator syncs it in the Argo CD UI after the `namespaces` app
# (creates the namespace) and the sealed grafana-secrets are in place.
# ServerSideApply: the hashed ConfigMaps and the dashboards can exceed the 256 KiB annotation limit of client-side apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: talos/manifests/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    # Manual sync, no automated block - same stance as every other app here.
