# The second copy of the backups: MinIO on mini03 (the Talos worker VM on victus) fed by a daily mirror
# of the primary on mini02. Design: docs/dr/mini03.md (on the mini03 branches until they merge).
#
# MANUAL SYNC, and do not sync it before the node exists: every pod here is pinned to mini03 and needs
# the Secrets listed in talos/manifests/backup-replica/README.md, sealed by the operator. Until then this
# Application is only an OutOfSync object in Argo CD; it deploys nothing. No automated block on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup-replica
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: talos/manifests/backup-replica
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync, no automated block.
