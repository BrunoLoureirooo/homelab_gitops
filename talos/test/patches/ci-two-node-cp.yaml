# CI-only patches for the two-node harness (plan 15-01), one file per node. The first
# NIC is QEMU user-mode networking (DHCP, image pulls); the second joins a private
# socket network with fixed addresses. Both are matched by their fixed CI MAC
# addresses. etcd and the kubelet are pinned to the private network so the node
# address is not the user-mode one. The control plane is not schedulable here.
machine:
  certSANs:
    - 127.0.0.1
  network:
    interfaces:
      - deviceSelector:
          hardwareAddr: "52:54:00:12:34:56"
        dhcp: true
      - deviceSelector:
          hardwareAddr: "52:54:00:12:00:11"
        addresses:
          - 192.168.100.11/24
cluster:
  etcd:
    advertisedSubnets:
      - 192.168.100.0/24
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/vda"
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: tal-cp
auto: "off"
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.100.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
