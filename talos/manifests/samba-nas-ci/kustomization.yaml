# CI overlay (talos/test/jobs/nas-pod.sh, csi-smb.sh): runs the same manifests on
# the single QEMU node, over a plain directory instead of the ZFS dataset, and
# without a hostPort. The Secret is created by the job at run time. It sits
# beside the base (not inside it) so the base does not contain the overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../samba-nas
patches:
  - target:
      kind: Deployment
      name: samba-nas
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /var/lib/nas-ci
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
