# Alertmanager on mini02 next to Prometheus (plan 4.7). Alerts go to Discord (D1) and the Watchdog heartbeat to
# healthchecks.io (D4); both URLs are files of the sealed Secret monitoring/alertmanager-notifiers, mounted at
# /etc/alertmanager/secrets. Until that Secret exists the pod stays in ContainerCreating. Seal it from the repo root:
#   read -rs DISCORD_URL; read -rs HC_URL
#   kubectl create secret generic alertmanager-notifiers -n monitoring \
#       --from-literal=discord-webhook-url="$DISCORD_URL" --from-literal=healthchecks-ping-url="$HC_URL" \
#       --dry-run=client -o json |
#     KUBECONFIG=/dev/null kubeseal --cert argocd/sealed-secrets/pub-cert.pem --format yaml \
#       > talos/sealed-secrets/alertmanager-notifiers.yaml
#   unset DISCORD_URL HC_URL
# then add `- alertmanager-notifiers.yaml` to talos/sealed-secrets/kustomization.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: alertmanager-data, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: topolvm-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: monitoring, labels: {app.kubernetes.io/name: alertmanager}}
spec:
  selector: {app.kubernetes.io/name: alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alertmanager, namespace: monitoring, labels: {app.kubernetes.io/name: alertmanager}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  template:
    metadata: {labels: {app.kubernetes.io/name: alertmanager}}
    spec:
      priorityClassName: hs-critical
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: mini01}
      tolerations: [{key: node.kubernetes.io/unschedulable, operator: Exists, effect: NoSchedule}]
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
          ports: [{name: http, containerPort: 9093}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml}
            - {name: notifiers, mountPath: /etc/alertmanager/secrets, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - {name: config, configMap: {name: alertmanager-config}}
        # defaultMode 288 == 0440 octal (yamllint octal-values forbids the literal)
        - {name: notifiers, secret: {secretName: alertmanager-notifiers, defaultMode: 288}}
        - {name: data, persistentVolumeClaim: {claimName: alertmanager-data}}
