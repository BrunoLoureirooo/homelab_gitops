# Grafana on mini03, tailnet only through the Tailscale operator (plan 5.1). Data source and dashboards are
# provisioned from git, so the only state in the volume is users and preferences. The admin password comes from the
# sealed Secret grafana-secrets (talos/sealed-secrets/grafana-secrets.yaml); it is applied only when the database
# is first created. Alerting lives in Prometheus/Alertmanager, so Grafana's own alerting is switched off.
# Before the first sync delete any stale `grafana` device in the Tailscale admin console, otherwise the new one
# registers as `grafana-1` (same note as talos/manifests/jellyfin/ingress.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data-mini03, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: topolvm-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring, labels: {app.kubernetes.io/name: grafana}}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring, labels: {app.kubernetes.io/name: grafana}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      priorityClassName: hs-interactive
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: mini03}
      tolerations:
        - {key: node-role.homeserver/tier, operator: Equal, value: mobile, effect: NoSchedule}
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-secrets, key: GF_SECURITY_ADMIN_PASSWORD}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_ANONYMOUS_HIDE_VERSION, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_UNIFIED_ALERTING_ENABLED, value: "false"}
            # Grafana 13 preinstalls/updates bundled plugins at startup; on the read-only root filesystem the update
            # unloads the bundled prometheus datasource plugin and then fails to replace it, so every panel shows no data.
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            # Soft memory target ~88% of the 1Gi limit so the Go GC backs off before the kernel OOM-kills the pod.
            - {name: GOMEMLIMIT, value: 900MiB}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grafana-data-mini03}}
        - {name: tmp, emptyDir: {sizeLimit: 100Mi}}
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - name: dashboards
          projected:
            sources:
              - configMap: {name: grafana-dash-node-exporter}
              - configMap: {name: grafana-dash-kube-state}
              - configMap: {name: grafana-dash-argocd}
              - configMap: {name: grafana-dash-cnpg}
              - configMap: {name: grafana-dash-cluster-overview}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
# proxy-class: pins the tailnet proxy pod to mini03 next to the backend (talos/manifests/tailscale-proxyclasses/observability.yaml)
metadata: {name: grafana, namespace: monitoring, labels: {app.kubernetes.io/name: grafana, tailscale.com/proxy-class: observability}}
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: grafana, port: {number: 3000}}}}
  tls:
    - hosts: [grafana]
