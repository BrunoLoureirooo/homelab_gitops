# The pod uses a hostPath volume and a hostPort, which the baseline Pod Security
# level forbids, so this namespace is privileged. Nothing else runs here.
apiVersion: v1
kind: Namespace
metadata:
  name: nas
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
