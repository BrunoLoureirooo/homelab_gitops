# Jellyfin on the tailnet only, served by the Tailscale operator like immich and vaultwarden. The
# hostname comes from tls.hosts (`jellyfin`); the full tailnet name is a host detail and is not
# committed. A stale `jellyfin` device from the old cluster in the tailnet makes the new one register
# as `jellyfin-1`: delete the stale device in the Tailscale admin console first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
  tls:
    - hosts:
        - jellyfin
