# AdGuard Home (network-wide ad blocking DNS for the tailnet). The Secret `adguard-admin`
# (keys password, bcrypt-hash) comes from talos/sealed-secrets/adguard-admin.yaml; this app does not
# create it, and the pod stays in ContainerCreating until it exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
