# AdGuard Home runs non-root with one added capability and a sysctl for port 53, so the strict
# `restricted` Pod Security level is enough.
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
