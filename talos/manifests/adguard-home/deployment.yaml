# AdGuard Home: network-wide ad and tracker blocking DNS for the tailnet (The operator 2026-10-17).
#
# - One replica pinned to mini01 (mini02 is cordoned on purpose).
# - Non-root (uid 1000). Port 53 works through the safe sysctl net.ipv4.ip_unprivileged_port_start=0.
#   The image's binary carries a file capability, and the kernel refuses to start it when that
#   capability is missing from the container, so NET_BIND_SERVICE is the one capability kept.
#   AdGuard Home refuses to FIRST-launch as non-root; the seeded config below means it is never a
#   first launch.
# - The init container writes /conf/AdGuardHome.yaml from the ConfigMap only when the file does not
#   exist, with the admin password hash from the Secret `adguard-admin`. Settings changed in the web
#   UI persist on the volume and are never overwritten.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
    spec:
      nodeSelector:
        kubernetes.io/hostname: mini01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      initContainers:
        - name: seed-config
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -f /conf/AdGuardHome.yaml ]; then
                echo "config exists, not re-seeding"
                exit 0
              fi
              hash="$(cat /secret/bcrypt-hash)"
              sed "s|@@ADMIN_HASH@@|${hash}|" /template/AdGuardHome.yaml > /conf/AdGuardHome.yaml.tmp
              mv /conf/AdGuardHome.yaml.tmp /conf/AdGuardHome.yaml
              echo "seeded a new config"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /conf, subPath: conf}
            - {name: template, mountPath: /template, readOnly: true}
            - {name: admin, mountPath: /secret, readOnly: true}
      containers:
        - name: adguard-home
          # v0.107.79 (2026-08-18), the multi-arch index digest.
          image: docker.io/adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: web, containerPort: 3000, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            httpGet: {path: /login.html, port: web}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: dns-tcp}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /opt/adguardhome/work, subPath: work}
            - {name: data, mountPath: /opt/adguardhome/conf, subPath: conf}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-data
        - name: template
          configMap:
            name: adguard-config
        - name: admin
          secret:
            secretName: adguard-admin
            items:
              - {key: bcrypt-hash, path: bcrypt-hash}
