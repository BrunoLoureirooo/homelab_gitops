# The Immich photo library as an SMB volume: a static PV (csi-driver-smb) over the share `immich`
# of the Samba pod on mini02 (dataset tank/immich), and the claim Immich and the library backup use.
#
# Immich runs as root, so the mount presents every file as uid/gid 0. The credentials are the
# sealed Secret `smb-csi-credentials` in namespace `nas`. `nobrl` turns off byte-range locking,
# which SMB handles poorly and Immich does not rely on. Retain: deleting the claim never deletes
# the files on mini02.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-smb
spec:
  capacity:
    storage: 64Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - uid=0
    - gid=0
    - vers=3.1.1
    - nobrl
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: mini02-samba-nas#immich#immich-library-smb
    volumeAttributes:
      source: //samba-nas.nas.svc.cluster.local/immich
    nodeStageSecretRef:
      name: smb-csi-credentials
      namespace: nas
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-smb
  namespace: homeserver
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: immich-library-smb
  resources:
    requests:
      storage: 64Gi
