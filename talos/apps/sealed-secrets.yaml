# --controller-namespace flag needed every time.
#
# THE MOMENT THIS SYNCS: back up the controller's key before anything else -
# it's the one thing here with no recovery path from git if it's lost.
#   kubectl get secret -n kube-system -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml \
#     > sealed-secrets-key-backup.yaml
# Store that file OFFLINE (password manager, same place the Tailscale/SSH
# key material lives) - never in this repo, not even encrypted.
apiVersion: argoproj.io/v1alpha1
