# The Talos cluster's App-of-Apps root (plan 15-03). Applied ONCE, by hand or by
# talos/bootstrap-argocd.sh --live. It watches talos/apps/ (generated by
# talos/render-apps.sh from argocd/apps/ and talos/apps-src/), never
# argocd/apps/, which belongs to the live k3s cluster. The syncPolicy is copied
# from argocd/apps/root.yaml: this app only ever manages Application manifests,
# so prune/selfHeal cannot touch app data.
# CI never applies this file: it applies the Applications directly with their
# targetRevision rewritten to the commit under test.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoLoureirooo/homelab_gitops
    targetRevision: main
    path: talos/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
